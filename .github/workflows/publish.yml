name: publish

# Tag a release and push the tag; setuptools-scm takes the version from it:
#   git tag -a 0.1.0 -m "..." && git push origin 0.1.0
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # a shallow clone has no tags, so setuptools-scm would emit a dev version
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the version matches the tag
        run: |
          ls dist/
          test -f "dist/nostrj-${GITHUB_REF_NAME}.tar.gz" || {
            echo "built version does not match tag ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # trusted publishing: no API token stored in the repo
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
