name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm reads the version from tags
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libsecp256k1 build deps
        run: sudo apt-get update && sudo apt-get install -y libsecp256k1-dev pkg-config
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r test/requirements.txt
      - name: Run tests
        run: python -m pytest test -q
